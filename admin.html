<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    body { 
        background: #your-background-color; 
        visibility: hidden; 
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinUp Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px;">
        <img src="joinup-logo.png" style="height:80px; margin-bottom:20px;">
        <h2 style="color:var(--text-primary); margin-bottom:20px;">Admin Login</h2>
        <input type="email" id="admin-email" placeholder="Enter email" style="padding:12px 20px; border-radius:25px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:var(--text-primary); font-size:16px; outline:none; width:80%; box-sizing:border-box; margin-bottom:15px;">
        <input type="password" id="admin-password" placeholder="Enter password" style="padding:12px 20px; border-radius:25px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:var(--text-primary); font-size:16px; outline:none; width:80%; box-sizing:border-box; margin-bottom:15px;">
        <button onclick="adminLogin()" style="background:linear-gradient(135deg, #0088cc, #25a244); color:white; border:none; padding:12px 30px; border-radius:25px; font-size:16px; font-weight:bold; cursor:pointer; width:80%;">Login</button>
        <p id="login-error" style="color:red; margin-top:10px; display:none;">Wrong email or password!</p>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" style="display:none;">
        <header>
            <div class="header-top">
                <img class="logo" src="joinup-logo.png" alt="JoinUp Logo">
                <button onclick="adminLogout()" style="background:red; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold;">Logout</button>
            </div>
        </header>
        <main style="padding-bottom:40px;">
            <div style="padding:15px;">
                <h2 style="color:var(--text-primary);">⏳ Pending Groups</h2>
                <div id="pending-container">
                    <p style="color:gray;">Loading...</p>
                </div>
            </div>
            <div style="padding:15px;">
                <h2 style="color:var(--text-primary);">✅ Approved Groups</h2>
                <div id="approved-container">
                    <p style="color:gray;">Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) showPanel();
        }

        checkSession();

        async function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const btn = document.querySelector('#login-screen button');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                document.getElementById('login-error').style.display = 'block';
                btn.innerHTML = 'Login';
                btn.disabled = false;
            } else {
                showPanel();
            }
        }

        async function adminLogout() {
            await db.auth.signOut();
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('admin-panel').style.display = 'none';
        }

        function showPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadPending();
            loadApproved();
        }

        async function loadPending() {
            const { data, error } = await db
                .from('groups')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            const container = document.getElementById('pending-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color:gray;">No pending groups! ✅</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(group => {
                const date = new Date(group.created_at).toLocaleString();
                container.innerHTML += `
                    <div style="background:rgba(255,255,255,0.1); border-radius:15px; padding:15px; margin-bottom:15px;">
                        <h3 style="color:var(--text-primary); margin:0 0 5px;">${group.name}</h3>
                        <p style="color:gray; font-size:13px; margin:3px 0;">📱 ${group.platform} • ${group.type || ''} • 🏷️ ${group.category}</p>
                        <p style="color:gray; font-size:13px; margin:3px 0;">🔗 <a href="${group.link}" target="_blank" style="color:#0088cc;">${group.link}</a></p>
                        <p style="color:gray; font-size:13px; margin:3px 0;">📧 ${group.email || 'No email provided'}</p>
                        <p style="color:gray; font-size:13px; margin:3px 0 5px;">📝 ${group.description}</p>
                        <p style="color:gray; font-size:11px; margin:0 0 10px;">🕐 Submitted: ${date}</p>
                        <div style="display:flex; gap:10px;">
                            <button onclick="approveGroup('${group.link}')" style="background:#25a244; color:white; border:none; padding:8px 20px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">✅ Approve</button>
                            <button onclick="rejectGroup('${group.link}')" style="background:red; color:white; border:none; padding:8px 20px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">❌ Reject</button>
                        </div>
                    </div>
                `;
            });
        }

        async function loadApproved() {
            const { data, error } = await db
                .from('groups')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false });

            const container = document.getElementById('approved-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color:gray;">No approved groups yet!</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(group => {
                const date = new Date(group.created_at).toLocaleString();
                const featuredBtn = group.featured
                    ? `<button onclick="toggleFeatured('${group.link}', false)" style="background:#f0a500; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">⭐ Unfeature</button>`
                    : `<button onclick="toggleFeatured('${group.link}', true)" style="background:rgba(255,255,255,0.1); color:var(--text-primary); border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">⭐ Feature</button>`;

                const verifiedBtn = group.verified
                    ? `<button onclick="toggleVerified('${group.link}', false)" style="background:#1DA1F2; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">✔ Unverify</button>`
                    : `<button onclick="toggleVerified('${group.link}', true)" style="background:rgba(255,255,255,0.1); color:var(--text-primary); border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:20px; cursor:pointer; font-weight:bold; flex:1;">✔ Verify</button>`;

                container.innerHTML += `
                    <div style="background:rgba(255,255,255,0.1); border-radius:15px; padding:15px; margin-bottom:15px;">
                        <h3 style="color:var(--text-primary); margin:0 0 5px;">${group.name}</h3>
                        <p style="color:gray; font-size:13px; margin:3px 0;">📱 ${group.platform} • ${group.type || ''} • 🏷️ ${group.category}</p>
                        <p style="color:gray; font-size:13px; margin:3px 0;">🔗 <a href="${group.link}" target="_blank" style="color:#0088cc;">${group.link}</a></p>
                        <p style="color:gray; font-size:13px; margin:3px 0;">📧 ${group.email || 'No email provided'}</p>
                        <p style="color:gray; font-size:13px; margin:3px 0 5px;">📝 ${group.description}</p>
                        <p style="color:gray; font-size:11px; margin:0 0 10px;">🕐 Submitted: ${date}</p>
                        <div style="display:flex; gap:10px; margin-bottom:10px;">
                            ${featuredBtn}
                            ${verifiedBtn}
                        </div>
                        <button onclick="deleteGroup('${group.link}')" style="background:red; color:white; border:none; padding:8px 20px; border-radius:20px; cursor:pointer; font-weight:bold; width:100%;">🗑️ Delete</button>
                    </div>
                `;
            });
        }

        async function approveGroup(link) {
            const { error } = await db
                .from('groups')
                .update({ status: 'approved' })
                .eq('link', link);
            if (!error) { loadPending(); loadApproved(); }
        }

        async function rejectGroup(link) {
            const { error } = await db
                .from('groups')
                .delete()
                .eq('link', link);
            if (!error) loadPending();
        }

        async function deleteGroup(link) {
    const { error } = await db
        .from('groups')
        .delete()
        .eq('link', link);
    if (!error) { loadApproved(); loadPending(); }
}

        async function toggleFeatured(link, value) {
            const { error } = await db
                .from('groups')
                .update({ featured: value })
                .eq('link', link);
            if (!error) loadApproved();
        }

        async function toggleVerified(link, value) {
            const { error } = await db
                .from('groups')
                .update({ verified: value })
                .eq('link', link);
            if (!error) loadApproved();
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('admin-password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') adminLogin();
            });
        });
    </script>
    <script>
    document.body.style.visibility = 'visible'
</script>
</body>
</html>
