<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    body { 
        background: #your-background-color; 
        visibility: hidden; 
    }
</style>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/joinup-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinUp - Explore Groups & Channels</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta property="og:title" content="JoinUp - Discover and Join Groups">
    <meta property="og:description" content="Your Gateway to Knowledge, Growth & Community!">
    <meta property="og:image" content="https://joinup-two.vercel.app/joinup-logo.png">
    <meta property="og:url" content="https://joinup-two.vercel.app">
    <meta name="description" content="Discover and join the best Telegram and WhatsApp groups and channels.">
</head>
<body>
    <header>
        <div class="header-top">
            <img class="logo" src="/joinup-logo.png" alt="JoinUp Logo">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <div class="theme-wave" id="themeWave"></div>
                <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>
        </div>
        <nav>
            <a href="#crypto">Crypto</a>
            <a href="#tech">Tech</a>
            <a href="#education">Education</a>
            <a href="#business">Business</a>
            <a href="#gaming">Gaming</a>
            <a href="#religious">Religious</a>
            <a href="#football">Football</a>
            <a href="#fun">Fun</a>
            <a href="#entertainment">Entertainment</a>
        </nav>
    </header>

    <main>
        <div class="explore-search">
            <input type="search" placeholder="Search groups...">
            <button class="search-btn">Search</button>
        </div>

        <div id="explore-container">
            <!-- Categories load here -->
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="/submit" class="nav-item nav-add">
            <i class="fa-solid fa-plus"></i>
        </a>
        <a href="/explore" class="nav-item active">
            <i class="fa-solid fa-compass"></i>
            <span>Explore</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase.js"></script>
    <script src="/script.js"></script>
</body>
</html>
